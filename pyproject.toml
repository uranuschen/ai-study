[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-learning"
version = "0.1.0"
description = "面向学习的 RAG 与 LangGraph FastAPI 接口"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.30,<4", "python-dotenv>=1,<2", "psycopg2-binary>=2.9,<3",
  "sentence-transformers>=3,<4", "jieba>=0.42,<1", "rank-bm25>=0.2,<1",
  "pypdf>=4,<7", "python-docx>=1,<2", "openpyxl>=3.1,<4",
  "langgraph>=1.2,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  # 第 71 课先固定后续课程使用的 MCP SDK 版本。
  "mcp==2.3.0"
]

[project.scripts]
rag-study = "agent_learning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
